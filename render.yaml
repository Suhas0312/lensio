# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the Lensio web service (API + admin panel + web app) from backend/Dockerfile.
# The database is external (Neon); paste its connection string into DATABASE_URL.
# Every variable is explained in backend/.env.example.
services:
  - type: web
    name: lensio-api
    runtime: docker
    rootDir: backend
    plan: free            # use "starter" or higher for launch: free instances sleep when idle
    region: singapore
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }          # Neon direct connection string, without &channel_binding=require
      - { key: JWT_SECRET, generateValue: true }
      - { key: PUBLIC_BASE_URL, sync: false }       # e.g. https://lensio-api.onrender.com or your own domain
      - { key: ADMIN_EMAILS, sync: false }          # comma-separated, no spaces
      - { key: SUPPORT_WHATSAPP_NUMBER, sync: false } # 91 + 10 digits
      - { key: SEED_ON_START, value: "true" }       # safe to leave on: only adds defaults once
      - { key: STORAGE_DRIVER, value: s3 }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_REGION, value: auto }
      - { key: S3_ENDPOINT, sync: false }           # https://<account-id>.r2.cloudflarestorage.com
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: S3_PUBLIC_URL, sync: false }         # https://pub-xxxx.r2.dev or a custom media domain
      - { key: BREVO_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }             # a sender verified in Brevo
      - { key: MAIL_FROM_NAME, value: Lensio }
      - { key: GEMINI_API_KEY, sync: false }        # optional: turns on the full AI assistant
      # Optional integrations (leave unset until ready):
      # RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
      # SHIPROCKET_EMAIL, SHIPROCKET_PASSWORD, SHIPROCKET_PICKUP_LOCATION, SHIPROCKET_WEBHOOK_TOKEN,
      # WhatsApp (login codes + all customer updates): WHATSAPP_TOKEN, WHATSAPP_PHONE_NUMBER_ID,
      #   OWNER_WHATSAPP_NUMBERS (your 10-digit number(s), comma-separated, for shop alerts). See docs/WHATSAPP-SETUP.md
      # SMS backup for login codes: MSG91_AUTH_KEY, MSG91_TEMPLATE_ID,
      # REVIEW_EMAIL, REVIEW_OTP (app-store review login)
