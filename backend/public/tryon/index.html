<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lensio — Try on</title>
<link rel="icon" href="/admin/mark.png">
<meta name="theme-color" content="#040722">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --night:#040722;--surface:#0C1138;--line:#242B66;--text:#F3F4FF;--muted:#A3A8D2;--faint:#6A70A0;--cyan:#08B9DB;--violet:#7B61FF;--ok:#3DD68C;
 --grad:linear-gradient(90deg,#08B9DB,#7B61FF 50%,#C94EF2);--f:'Quicksand',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;background:var(--night);color:var(--text);font:500 15px/1.4 var(--f)}
body{display:flex;flex-direction:column;min-height:100%}
.wrap{width:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;flex:1;min-height:0}
header{display:flex;align-items:center;gap:10px;padding:10px 14px}
header h1{font-size:18px;margin:0;flex:1}
.iconbtn{background:none;border:0;color:var(--text);font:700 22px var(--f);cursor:pointer;padding:4px 8px;border-radius:10px;line-height:1}
.toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{width:18px;height:18px;accent-color:var(--violet)}
.layout{display:flex;flex-direction:column;gap:12px;padding:0 14px 14px;flex:1;min-height:0}
@media (min-width:860px){.layout{flex-direction:row;align-items:flex-start}.stagecol{flex:1.3}.side{flex:1;max-width:380px}}
.stage{position:relative;width:100%;aspect-ratio:3/4;max-height:68vh;background:#10143a;border-radius:18px;overflow:hidden;touch-action:none;margin:0 auto}
@media (min-width:860px){.stage{aspect-ratio:4/3;max-height:72vh}}
.stage video,.stage .photo{position:absolute;inset:0;width:100%;height:100%}
.stage video{object-fit:cover;transform:scaleX(-1)}
.stage .photo{object-fit:contain;background:#10143a}
.stage .face{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);text-align:center;padding:24px}
.overlay{position:absolute;left:0;top:0;transform-origin:center center;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-drag:none;display:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.status{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(4,7,34,.78);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{font:700 14px var(--f);border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:11px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.p{background:var(--grad);border:0;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.shape{font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
@media (min-width:860px){.strip{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible}}
.fr{flex:none;width:110px;background:#F4F5FB;border:2px solid transparent;border-radius:12px;padding:6px 6px 4px;cursor:pointer;text-align:left;font-family:var(--f);position:relative}
@media (min-width:860px){.fr{width:auto}}
.fr.on{border-color:var(--violet)}
.fr img{width:100%;height:46px;object-fit:contain;display:block}
.fr .n{font-size:11.5px;font-weight:700;color:#161A3A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.fr .pr{font-size:11.5px;color:#5E6388}
.fr .tag{position:absolute;top:4px;right:4px;background:var(--ok);color:#04311d;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.sel{display:flex;align-items:center;gap:10px}
.sel .grow{flex:1;min-width:0}
.swatches{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:-4px}
.sw{width:30px;height:30px;border-radius:50%;background:var(--c);border:2px solid var(--line);cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--night)}
.sw.on{border-color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:600 13px var(--f);border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--text);padding:7px 13px;cursor:pointer}
.chip.on{background:var(--violet);border-color:var(--violet);color:#fff}
.sel b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot{position:fixed;inset:0;background:rgba(2,3,20,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:10}
.shot img{max-width:100%;max-height:70vh;border-radius:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#151B4D;border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:11;max-width:92vw}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="iconbtn" id="back" aria-label="Back">←</button>
    <h1>Try on</h1>
    <label class="toggle"><input type="checkbox" id="auto" checked> Auto-fit</label>
  </header>
  <div class="layout">
    <div class="stagecol">
      <div class="stage" id="stage">
        <div class="face" id="placeholder"><div><div style="font-size:44px">👓</div><p>Turn on your camera or upload a selfie.<br>We'll place the frames on your face automatically.</p></div></div>
        <video id="video" playsinline muted autoplay hidden></video>
        <img id="photo" class="photo" alt="Your photo" hidden>
        <img id="overlay" class="overlay" alt="" draggable="false">
        <div class="status" id="status">Loading try-on…</div>
      </div>
      <div class="actions">
        <button class="btn p" id="camBtn">📷 Live camera</button>
        <button class="btn" id="selfieBtn">🖼️ Upload selfie</button>
        <button class="btn" id="measureBtn">📏 Measure my size</button>
        <button class="btn" id="captureBtn" disabled>📸 Capture</button>
        <input type="file" id="selfieIn" accept="image/*" capture="user" hidden>
      </div>
    </div>
    <div class="side">
      <div class="card" id="shapeCard"><span class="muted small">Face shape</span><div class="shape" id="shapeText">We'll suggest frames once we see your face.</div></div>
      <div class="card" id="sizeCard"><span class="muted small">Frame size</span>
        <div id="sizeText" style="margin:4px 0 10px"></div>
        <div class="chips" id="sizeChips" role="group" aria-label="Frame size"></div>
        <p class="muted small" id="sizeNone" hidden style="margin:8px 0 0"></p></div>
      <div class="card sel" id="selCard" hidden>
        <div class="grow"><b id="selName"></b><span class="muted small" id="selMeta"></span></div>
        <button class="btn p" id="viewBtn">View frame</button>
      </div>
      <div class="card swatches" id="swatches" hidden aria-label="Frame colours"></div>
      <div class="strip" id="strip" aria-label="Frames"></div>
    </div>
  </div>
</div>
<div class="shot" id="shot" role="dialog" aria-label="Your try-on photo">
  <img id="shotImg" alt="Your try-on photo">
  <div class="actions"><button class="btn p" id="shareBtn">Share</button><button class="btn" id="saveBtn">Save</button><button class="btn" id="closeShot">Close</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/tryon/face-api.js" defer></script>
<script src="/tryon/tryon.js?v=6" defer></script>
</body>
</html>
