<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Lensio admin</title>
<link rel="icon" href="mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --night:#040722;--bg:#F5F6FB;--card:#fff;--line:#E1E3EF;--text:#161A3A;--muted:#5E6388;--faint:#9296B5;
 --cyan:#08B9DB;--violet:#6A4FF5;--magenta:#C94EF2;--ok:#1B9E62;--warn:#B7700A;--bad:#D4344F;
 --grad:linear-gradient(90deg,#08B9DB,#7B61FF 50%,#C94EF2);--f:'Quicksand',ui-rounded,system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070A26;--card:#0E1340;--line:#242B66;--text:#F3F4FF;--muted:#A3A8D2;--faint:#6F75A6;--violet:#8B75FF;--ok:#3DD68C;--warn:#FFB547;--bad:#FF6B86}}
:root[data-theme="dark"]{--bg:#070A26;--card:#0E1340;--line:#242B66;--text:#F3F4FF;--muted:#A3A8D2;--faint:#6F75A6;--violet:#8B75FF;--ok:#3DD68C;--warn:#FFB547;--bad:#FF6B86}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:500 15px/1.45 var(--f)}
header{background:var(--night);color:#F3F4FF;display:flex;align-items:center;gap:24px;padding:12px 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
header img{height:26px}
nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav button{background:none;border:0;color:#A3A8D2;font:600 14px var(--f);padding:8px 12px;border-radius:10px;cursor:pointer}
nav button.on{color:#fff;background:#1A2058}
header .who{font-size:13px;color:#A3A8D2}
main{max-width:1180px;margin:0 auto;padding:24px}
h1{font-size:24px;margin:0}
h2{font-size:18px;margin:0}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.bar .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.ig2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:end}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:500 15px var(--f);color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--violet);outline-offset:1px}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:15px;font-weight:500}
.check input{width:18px;height:18px}
button.btn{font:700 14px var(--f);border-radius:999px;padding:10px 18px;border:1.5px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;white-space:nowrap}
button.btn.p{background:var(--grad);border:0;color:#fff}
button.btn.danger{color:var(--bad)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.link{background:none;border:0;color:var(--violet);font:700 14px var(--f);cursor:pointer;padding:4px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12.5px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--violet) 6%,transparent)}
.thumb{width:64px;height:48px;border-radius:8px;background:#F4F5FB;object-fit:contain;border:1px solid var(--line)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--muted) 14%,transparent);color:var(--muted)}
.pill.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.err{color:var(--bad);font-size:13px;font-weight:600}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photo{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#F4F5FB;aspect-ratio:4/3}
.photo img{width:100%;height:100%;object-fit:contain}
.photo .tools{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;background:rgba(4,7,34,.72);padding:4px}
.photo .tools button{background:none;border:0;color:#fff;font:700 13px var(--f);cursor:pointer;padding:4px 8px}
.photo .main{position:absolute;top:6px;left:6px;background:var(--night);color:#fff;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.drop{border:2px dashed var(--line);border-radius:12px;display:grid;place-items:center;text-align:center;padding:14px;cursor:pointer;color:var(--muted);font-weight:600;aspect-ratio:4/3;background:none;font-family:var(--f)}
.drop.over{border-color:var(--violet);color:var(--violet)}
.vrow{display:grid;grid-template-columns:1.2fr 64px 1fr 1.3fr .8fr .9fr 36px;gap:8px;align-items:end}
.vrow input[type=color]{padding:2px;height:42px}
.vrow .x{background:none;border:0;color:var(--bad);font-size:20px;cursor:pointer;height:42px}
.login{max-width:380px;margin:12vh auto;display:flex;flex-direction:column;gap:16px}
.login .logo{background:var(--night);border-radius:16px;padding:28px;display:grid;place-items:center}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(10px);background:var(--night);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
.sticky{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:flex-end;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px;box-shadow:0 8px 24px -12px rgba(0,0,0,.25);margin-top:18px}
.rximg{max-width:100%;border-radius:12px;border:1px solid var(--line)}
.eyes{display:grid;grid-template-columns:80px repeat(4,1fr);gap:8px;align-items:center}
@media (max-width:760px){main{padding:16px}.vrow{grid-template-columns:1fr 1fr;}.vrow .x{grid-column:2;justify-self:end}header{padding:10px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="admin.js?v=31"></script>
</body>
</html>
