# Keeps the Lensio server awake on Render's free plan.
# Render puts a free server to sleep after 15 minutes without visitors; the next visitor then sees
# Render's "Application loading" page for up to a minute. Visiting /health every 10 minutes prevents that.
# (A free Render service has 750 hours a month: enough to stay on all month.)
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Visit the server
        run: curl -fsS --max-time 90 --retry 2 https://lensio-api.onrender.com/health || echo "Server did not answer (it may be deploying)"
