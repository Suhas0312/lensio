# Android release, only when YOU raise the version.
# A release is built when "version" in mobile/app.json is higher than the newest release (e.g. 3.3.0 → 3.4.0).
# Small fixes uploaded without changing the version do NOT create a new app version.
# Manual run (Actions tab → Run workflow) can force a release; it then uses the next patch number.
#   1. builds the APK on Expo, 2. publishes a GitHub release with lensio.apk.
# Lensio's server checks this repo's newest release every few minutes, so /download, /download/lensio.apk
# and the in-app "Update available" window switch to it automatically. No admin step needed.
#
# One-time setup: add the EXPO_TOKEN secret (see docs/AUTO-RELEASE.md).

name: Android app release

on:
  push:
    branches: [main]
    paths: ['mobile/**']
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown to customers). Leave empty for a default note."
        required: false
      force:
        description: "Release even if the version in mobile/app.json was not raised (uses the next patch number)"
        type: boolean
        default: false
      expo_cloud:
        description: "Build on Expo's servers instead of GitHub (uses Expo's monthly free builds)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_NO_VCS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add the EXPO_TOKEN secret: GitHub repo → Settings → Secrets and variables → Actions. See docs/AUTO-RELEASE.md."
            exit 1
          fi

      - name: Has the version been raised?
        id: gate
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          want=$(node -p "require('./app.json').expo.version")
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)
          newest=$(printf '%s\n%s\n' "$want" "${latest:-0.0.0}" | sort -V | tail -1)
          if [ "$FORCE" = "true" ] || { [ "$want" != "$latest" ] && [ "$newest" = "$want" ]; }; then
            echo "release=yes" >> "$GITHUB_OUTPUT"; echo "Releasing (app.json $want, newest release ${latest:-none})"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "### No new app version" >> "$GITHUB_STEP_SUMMARY"
            echo "mobile/app.json says $want and release v$latest already exists. Raise the version in mobile/app.json to publish a new app." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Pick the version
        id: ver
        if: steps.gate.outputs.release == 'yes'
        run: node scripts/next-version.js

      - name: What's new
        if: steps.gate.outputs.release == 'yes'
        id: notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          notes="$INPUT_NOTES"
          first_line="$(printf '%s' "$COMMIT_MSG" | head -n 1)"
          # GitHub's default upload messages are not useful to customers
          if [ -z "$notes" ] && [ -n "$first_line" ] && ! printf '%s' "$first_line" | grep -qiE '^(add files via upload|update |create |delete |merge )'; then
            notes="$first_line"
          fi
          [ -z "$notes" ] && notes="Improvements and fixes."
          { echo "text<<NOTES_EOF"; echo "$notes"; echo "NOTES_EOF"; } >> "$GITHUB_OUTPUT"

      - name: Install app packages
        if: steps.gate.outputs.release == 'yes'
        run: npm ci --no-audit --no-fund

      # The APK is built right here on GitHub's machine (free and unlimited for public repositories), so Expo's monthly
      # free-build limit no longer stops releases. Expo is only asked for the app's signing key and version number.
      - name: Set up Java 17 (Android builds)
        if: steps.gate.outputs.release == 'yes' && github.event.inputs.expo_cloud != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        if: steps.gate.outputs.release == 'yes' && github.event.inputs.expo_cloud != 'true'
        uses: android-actions/setup-android@v3

      - name: Build the APK on GitHub (15-30 minutes)
        if: steps.gate.outputs.release == 'yes' && github.event.inputs.expo_cloud != 'true'
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false
        run: |
          npx --yes eas-cli@16 build -p android --profile preview --local --non-interactive --output ./lensio.apk
          ls -la lensio.apk

      - name: Build the APK on Expo's servers (only when chosen, 10-40 minutes)
        if: steps.gate.outputs.release == 'yes' && github.event.inputs.expo_cloud == 'true'
        run: npx --yes eas-cli@16 build -p android --profile preview --non-interactive --wait --json > build.json

      - name: Download the APK (Expo build only)
        if: steps.gate.outputs.release == 'yes' && github.event.inputs.expo_cloud == 'true'
        run: |
          url=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8'));const x=Array.isArray(b)?b[0]:b;process.stdout.write((x&&x.artifacts&&(x.artifacts.applicationArchiveUrl||x.artifacts.buildUrl))||'')")
          if [ -z "$url" ]; then echo "::error::Expo did not return an APK link"; cat build.json; exit 1; fi
          curl -fsSL "$url" -o lensio.apk
          ls -la lensio.apk

      - name: Publish the GitHub release
        if: steps.gate.outputs.release == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
          NOTES: ${{ steps.notes.outputs.text }}
        run: |
          gh release create "v$VERSION" lensio.apk --title "Lensio $VERSION" --notes "$NOTES" --latest
          echo "### Released Lensio $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://github.com/${{ github.repository }}/releases/download/v$VERSION/lensio.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "Customers get it at /download within about 5 minutes." >> "$GITHUB_STEP_SUMMARY"
