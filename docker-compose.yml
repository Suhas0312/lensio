services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: lensio, POSTGRES_PASSWORD: lensio, POSTGRES_DB: lensio }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lensio"], interval: 5s, retries: 10 }
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://lensio:lensio@db:5432/lensio?schema=public
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy } }
volumes:
  pgdata:
